name: Build BetterWiFi RH

on:
  push:
    paths:
      - '.github/workflows/build-betterwifi.yml'
      - 'bwrh-031.part*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project
        shell: bash
        run: |
          cat bwrh-031.part0 bwrh-031.part1 bwrh-031.part2 bwrh-031.part3 bwrh-031.part4 > project.tar.gz.b64
          test "$(wc -c < project.tar.gz.b64 | tr -d ' ')" = "23080"
          base64 -D -i project.tar.gz.b64 -o project.tar.gz
          tar -tzf project.tar.gz >/dev/null
          tar -xzf project.tar.gz
          test -f BetterWiFi-RH/BetterWiFiRH.plist
          grep -q 'Version: 0.3.1' BetterWiFi-RH/control
          ls -la BetterWiFi-RH

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide package
        shell: bash
        run: |
          cd BetterWiFi-RH
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          echo "Built packages:"
          ls -lh packages/*.deb

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-RH-0.3.1-deb
          path: BetterWiFi-RH/packages/*.deb
          if-no-files-found: error
