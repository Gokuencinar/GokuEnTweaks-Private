name: Build BetterWiFi RH

on:
  push:
    paths:
      - '.github/workflows/build-betterwifi.yml'
      - 'project.tar.gz.b64'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project
        shell: bash
        run: |
          base64 -D -i project.tar.gz.b64 -o project.tar.gz
          tar -xzf project.tar.gz
          ls -la BetterWiFi-RH

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide package
        shell: bash
        run: |
          cd BetterWiFi-RH
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          echo "Built packages:"
          find packages -maxdepth 1 -type f -name '*.deb' -print
          dpkg-deb -I packages/*.deb

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-RH-deb
          path: BetterWiFi-RH/packages/*.deb
          if-no-files-found: error
