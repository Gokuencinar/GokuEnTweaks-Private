name: Build BetterWiFi RH

on:
  push:
    paths:
      - '.github/workflows/build-betterwifi.yml'
      - 'bwrh-031.part*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project
        shell: bash
        run: |
          cat bwrh-031.part0 bwrh-031.part1 bwrh-031.part2 bwrh-031.part3a bwrh-031.part3b bwrh-031.part4a bwrh-031.part4b > project.tar.gz.b64
          test "$(wc -c < project.tar.gz.b64 | tr -d ' ')" = "23080"
          test "$(shasum -a 256 project.tar.gz.b64 | awk '{print $1}')" = "06d45c36c480590e763fd562fabb358a31fced1ae94dd3890976bee02181f561"
          base64 -D -i project.tar.gz.b64 -o project.tar.gz
          tar -tzf project.tar.gz >/dev/null
          tar -xzf project.tar.gz
          test -f BetterWiFi-RH/BetterWiFiRH.plist
          grep -q 'Version: 0.3.1' BetterWiFi-RH/control
          python3 -c "p='BetterWiFi-RH/Tweak.xm'; s=open(p).read(); s=s.replace('[self bwrh_updateDetailsButton];','[(id)self bwrh_updateDetailsButton];'); open(p,'w').write(s)"
          grep -q '\[(id)self bwrh_updateDetailsButton\];' BetterWiFi-RH/Tweak.xm
          ls -la BetterWiFi-RH

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide package
        shell: bash
        run: |
          cd BetterWiFi-RH
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          echo "Built packages:"
          ls -lh packages/*.deb

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-RH-0.3.1-deb
          path: BetterWiFi-RH/packages/*.deb
          if-no-files-found: error
