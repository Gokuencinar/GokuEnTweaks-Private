          test "$(dpkg-deb -f "$rootless" Architecture)" = "iphoneos-arm64"
          dpkg-deb -f "$rootless" Depends | grep -F 'firmware (>= 15.0)'
          dpkg-deb -f "$rootless" Depends | grep -F 'firmware (<< 19.0)'
          dpkg-deb -c "$rootless" | grep -F 'var/jb/Library/MobileSubstrate/DynamicLibraries/BetterWiFiRH.dylib'
          dpkg-deb -c "$rootless" | grep -F 'var/jb/Library/PreferenceBundles/BetterWiFiRHPrefs.bundle'

          test "$(dpkg-deb -f "$rootful" Package)" = "com.betterwifirh.tweak"
          test "$(dpkg-deb -f "$rootful" Version)" = "0.3.12"
          test "$(dpkg-deb -f "$rootful" Architecture)" = "iphoneos-arm"
          dpkg-deb -f "$rootful" Depends | grep -F 'firmware (>= 15.0)'
