name: Build BetterWiFi Rootless + Rootful

on:
  push:
    paths:
      - '.github/workflows/build-betterwifi-compat.yml'
      - 'bwrh-031.part*'
      - 'patch_bwrh_032.py'
      - 'p035_*.b64'
      - 'patch_monitor_035.py'
      - 'patch_cleanup_035.py'
      - 'p036_*.b64'
      - 'patch_bwrh_037.py'
      - 'patch_bwrh_038.py'
      - 'patch_bwrh_039.py'
      - 'patch_bwrh_040.py'
      - 'patch_bwrh_041.py'
      - 'patch_bwrh_042.py'
      - 'patch_bwrh_043_multijailbreak.py'
      - 'credits_avatar.b64'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore BetterWiFi RH 0.3.12 compatibility source
        shell: bash
        run: |
          set -euo pipefail

          cat bwrh-031.part0 bwrh-031.part1 bwrh-031.part2 bwrh-031.part3a bwrh-031.part3b bwrh-031.part4a bwrh-031.part4b > project.tar.gz.b64
          test "$(wc -c < project.tar.gz.b64 | tr -d ' ')" = "23080"
          test "$(shasum -a 256 project.tar.gz.b64 | awk '{print $1}')" = "06d45c36c480590e763fd562fabb358a31fced1ae94dd3890976bee02181f561"
          base64 -D -i project.tar.gz.b64 -o project.tar.gz
          tar -tzf project.tar.gz >/dev/null
          tar -xzf project.tar.gz

          python3 patch_bwrh_032.py

          cat p035_0.b64 p035_1.b64 p035_2.b64 p035_3.b64 p035_4.b64 p035_5.b64 > patch_bwrh_035.diff.b64
          test "$(shasum -a 256 patch_bwrh_035.diff.b64 | awk '{print $1}')" = "9adf44526709a0c312390d0f0ea230b2e860999df462e146ce8c66d8cee6e58b"
          base64 -D -i patch_bwrh_035.diff.b64 -o patch_bwrh_035.diff
          test "$(shasum -a 256 patch_bwrh_035.diff | awk '{print $1}')" = "c1bef8d4ebd045787c95885a22630837bf5dcfdfc8a4db6f40389ae7ec64d874"

          cd BetterWiFi-RH
          patch -p0 < ../patch_bwrh_035.diff || true
          test -f Tweak.xm.rej
          test "$(grep -c '^@@' Tweak.xm.rej)" = "1"
          grep -q 'sampleSignal' Tweak.xm.rej
          cd ..
          python3 patch_monitor_035.py
          python3 patch_cleanup_035.py

          cd BetterWiFi-RH
          rm -f Tweak.xm.rej
          sed -i '' 's/^Version: 0.3.2$/Version: 0.3.5/' control
          python3 - <<'PY035'
          import plistlib
          from pathlib import Path
          p=Path('prefs/Resources/Info.plist')
          x=plistlib.loads(p.read_bytes())
          x['CFBundleShortVersionString']='0.3.5'
          x['CFBundleVersion']='8'
          p.write_bytes(plistlib.dumps(x,fmt=plistlib.FMT_XML,sort_keys=False))
          PY035
          grep -q '^Version: 0.3.5$' control

          cd ..
          cat p036_0.b64 p036_1.b64 p036_2.b64 > patch_bwrh_036.diff.b64
          test "$(shasum -a 256 patch_bwrh_036.diff.b64 | awk '{print $1}')" = "65bb06f7649aaeb76fd66bff32d1fa0a5b610c0e9cfe439b8efcd4454140a482"
          base64 -D -i patch_bwrh_036.diff.b64 -o patch_bwrh_036.diff
          test "$(shasum -a 256 patch_bwrh_036.diff | awk '{print $1}')" = "5ff85fd66bd0b85b3b53659fc1aa05cc77ae503fab0e39fa9556dee0b2770d59"

          cd BetterWiFi-RH
          patch -p1 < ../patch_bwrh_036.diff
          sed -i '' 's/^Version: 0.3.5$/Version: 0.3.6/' control
          python3 - <<'PY036'
          import plistlib
          from pathlib import Path
          info_path=Path('prefs/Resources/Info.plist')
          info=plistlib.loads(info_path.read_bytes())
          info['CFBundleShortVersionString']='0.3.6'
          info['CFBundleVersion']='9'
          info_path.write_bytes(plistlib.dumps(info,fmt=plistlib.FMT_XML,sort_keys=False))

          root_path=Path('prefs/Resources/Root.plist')
          root=plistlib.loads(root_path.read_bytes())
          changed=0
          for spec in root.get('items',[]):
              if spec.get('defaults')=='com.betterwifirh.preferences' and spec.get('key'):
                  spec['PostNotification']='com.betterwifirh.preferences.changed'
                  changed+=1
          if changed < 20:
              raise SystemExit(f'expected >=20 preference specifiers, found {changed}')
          root_path.write_bytes(plistlib.dumps(root,fmt=plistlib.FMT_XML,sort_keys=False))
          PY036
          grep -q '^Version: 0.3.6$' control
          grep -q 'BWRHApplyListPreferences' Tweak.xm

          cd ..
          python3 patch_bwrh_037.py
          cd BetterWiFi-RH
          grep -q '^Version: 0.3.7$' control
          grep -q 'WiFiDeviceClientScanCancel' Tweak.xm
          grep -q 'BWRHMWUnregisterLQM' Tweak.xm
          grep -q 'dispatch_source_create' Tweak.xm

          cd ..
          python3 patch_bwrh_038.py
          cd BetterWiFi-RH
          echo "CONTROL_VERSION=$(grep '^Version:' control)"
          grep -n 'BWRHIsNativeWiFiKitSnapshotObject' Tweak.xm | head
          grep -n 'isInstantHotspot' Tweak.xm | head
          echo "ANALYZER_BLOCK:"
          grep -n -A6 'self.scanSource = @"MobileWiFi directo"' Tweak.xm | head -12 || true
          test "$(grep '^Version:' control)" = "Version: 0.3.8"
          grep -q 'BWRHIsNativeWiFiKitSnapshotObject' Tweak.xm
          grep -q 'isInstantHotspot' Tweak.xm
          if grep -A5 'self.scanSource = @"MobileWiFi directo"' Tweak.xm | grep -q 'BWRHStoreNetworkSnapshot(results)'; then
            echo "MobileWiFi analyzer still contaminates native snapshot" >&2
            exit 1
          fi
          plutil -lint prefs/Resources/Root.plist
          plutil -lint prefs/Resources/Info.plist
          echo "BetterWiFi RH 0.3.8 source verified."

          cd ..
          python3 patch_bwrh_039.py
          cd BetterWiFi-RH
          test "$(grep '^Version:' control)" = "Version: 0.3.9"
          grep -q 'BWRHLanguageMode' Tweak.xm
          grep -q 'BWRHSystemUsesSpanish' Tweak.xm
          grep -q 'PSLinkListCell' prefs/Resources/Root.plist
          grep -q 'language' prefs/Resources/Root.plist
          grep -q 'BWRHPrefsLanguageMode' prefs/BWRHRootListController.m
          grep -q 'setPreferenceValue:' prefs/BWRHRootListController.m
          grep -q '"Language" = "Idioma";' prefs/Resources/es.lproj/Root.strings
          plutil -lint prefs/Resources/Root.plist
          plutil -lint prefs/Resources/Info.plist
          echo "BetterWiFi RH 0.3.9 language selector source verified."

          cd ..
          python3 patch_bwrh_040.py
          cd BetterWiFi-RH
          test "$(grep '^Version:' control)" = "Version: 0.3.10"
          grep -q 'PSSegmentCell' prefs/Resources/Root.plist
          ! grep -q 'PSLinkListCell' prefs/Resources/Root.plist || true
          grep -q 'dispatch_async(dispatch_get_main_queue()' prefs/BWRHRootListController.m
          plutil -lint prefs/Resources/Root.plist
          plutil -lint prefs/Resources/Info.plist
          echo "BetterWiFi RH 0.3.10 inline language selector source verified."

          cd ..
          python3 patch_bwrh_041.py
          cd BetterWiFi-RH
          test "$(grep '^Version:' control)" = "Version: 0.3.11"
          test -s prefs/Resources/CreditsAvatar.jpg
          grep -q 'Gokuencinar · GokuEn' prefs/BWRHRootListController.m
          grep -q 'https://github.com/Gokuencinar/GokuEnREPO' prefs/BWRHRootListController.m
          grep -q 'https://buymeacoffee.com/gokuen' prefs/BWRHRootListController.m
          grep -q 'bwrh_installCreditsFooter' prefs/BWRHRootListController.m
          plutil -lint prefs/Resources/Root.plist
          plutil -lint prefs/Resources/Info.plist
          echo "BetterWiFi RH 0.3.11 credits source verified."

          cd ..
          python3 patch_bwrh_042.py
          cd BetterWiFi-RH
          test "$(grep '^Version:' control)" = "Version: 0.3.12"
          grep -q 'constant:8.0' prefs/BWRHRootListController.m
          grep -q 'insideAdvancedFilters' prefs/BWRHRootListController.m
          grep -q 'specifier.name = @"Band filter"' prefs/BWRHRootListController.m
          grep -q 'specifier.name = @"Network type"' prefs/BWRHRootListController.m
          grep -q 'specifier.name = @"Minimum signal filter"' prefs/BWRHRootListController.m
          grep -q 'specifier.name = @"Sort networks"' prefs/BWRHRootListController.m
          plutil -lint prefs/Resources/Root.plist
          plutil -lint prefs/Resources/Info.plist
          echo "BetterWiFi RH 0.3.12 fixes source verified."

          cd ..
          python3 patch_bwrh_043_multijailbreak.py
          cd BetterWiFi-RH
          grep -q '@available(iOS 15.0, \*)' Tweak.xm
          ! grep -q '@available(iOS 16.0, \*)' Tweak.xm
          grep -q 'Advanced Wi-Fi enhancements for iOS 15+ jailbreaks' control
          echo "BetterWiFi RH multi-jailbreak source verified."

          cd ..
          rm -rf BetterWiFi-RH-rootless BetterWiFi-RH-rootful
          cp -R BetterWiFi-RH BetterWiFi-RH-rootless
          cp -R BetterWiFi-RH BetterWiFi-RH-rootful


      - name: Prepare package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          variants = {
              "BetterWiFi-RH-rootless": (
                  "firmware (>= 15.0), firmware (<< 19.0), preferenceloader",
                  "Advanced Wi-Fi enhancements for rootless jailbreaks on iOS 15-18.",
                  "iphoneos-arm64",
              ),
              "BetterWiFi-RH-rootful": (
                  "firmware (>= 15.0), firmware (<< 18.0), preferenceloader",
                  "Advanced Wi-Fi enhancements for rootful jailbreaks on iOS 15-17.",
                  "iphoneos-arm",
              ),
          }

          for directory, (depends, short_desc, architecture) in variants.items():
              p = Path(directory) / "control"
              text = p.read_text()
              text = re.sub(r"^Depends:.*$", f"Depends: {depends}", text, count=1, flags=re.M)
              text = re.sub(
                  r"^Description:.*$",
                  "Description: " + short_desc + " Includes network details, live monitoring, diagnostics, filters, language selection and on-demand scanning.",
                  text,
                  count=1,
                  flags=re.M,
              )
              if re.search(r"^Architecture:", text, flags=re.M):
                  text = re.sub(r"^Architecture:.*$", f"Architecture: {architecture}", text, count=1, flags=re.M)
              else:
                  text += f"\nArchitecture: {architecture}\n"
              p.write_text(text)
          PY

          grep -q '^Version: 0.3.12$' BetterWiFi-RH-rootless/control
          grep -q '^Depends: firmware (>= 15.0), firmware (<< 19.0), preferenceloader$' BetterWiFi-RH-rootless/control
          grep -q '^Depends: firmware (>= 15.0), firmware (<< 18.0), preferenceloader

      - name: Setup standard Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build rootless iOS 15-18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd BetterWiFi-RH-rootless
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:latest:15.0 ARCHS="arm64 arm64e"
          deb="$(find packages -maxdepth 1 -name '*.deb' -type f | head -1)"
          test -n "$deb"
          cp "$deb" ../out/BetterWiFi-RH_0.3.12_Rootless_iOS15-18.deb

      - name: Build rootful iOS 15-17
        shell: bash
        run: |
          set -euo pipefail
          cd BetterWiFi-RH-rootful
          make clean
          make package FINALPACKAGE=1 TARGET=iphone:clang:latest:15.0 ARCHS="arm64 arm64e" PACKAGE_ARCH=iphoneos-arm
          deb="$(find packages -maxdepth 1 -name '*.deb' -type f | head -1)"
          test -n "$deb"
          cp "$deb" ../out/BetterWiFi-RH_0.3.12_Rootful_iOS15-17.deb

      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          rootless=out/BetterWiFi-RH_0.3.12_Rootless_iOS15-18.deb
          rootful=out/BetterWiFi-RH_0.3.12_Rootful_iOS15-17.deb

          validate_deb() {
            deb="$1"
            expected_arch="$2"
            expected_upper="$3"
            expected_prefix="$4"
            tmp="$(mktemp -d)"
            cp "$deb" "$tmp/package.deb"
            (
              cd "$tmp"
              ar -x package.deb
              control_archive="$(find . -maxdepth 1 -name 'control.tar.*' -type f | head -1)"
              data_archive="$(find . -maxdepth 1 -name 'data.tar.*' -type f | head -1)"
              test -n "$control_archive"
              test -n "$data_archive"
              mkdir control data
              tar -xf "$control_archive" -C control
              tar -xf "$data_archive" -C data
              grep -q '^Package: com.betterwifirh.tweak$' control/control
              grep -q '^Version: 0.3.12$' control/control
              grep -q "^Architecture: $expected_arch$" control/control
              grep -q '^Depends: firmware (>= 15.0)' control/control
              grep -q "firmware (<< $expected_upper)" control/control
              test -f "data/$expected_prefix/Library/MobileSubstrate/DynamicLibraries/BetterWiFiRH.dylib"
              test -d "data/$expected_prefix/Library/PreferenceBundles/BetterWiFiRHPrefs.bundle"
              file "data/$expected_prefix/Library/MobileSubstrate/DynamicLibraries/BetterWiFiRH.dylib"
              file "data/$expected_prefix/Library/PreferenceBundles/BetterWiFiRHPrefs.bundle/BetterWiFiRHPrefs"
              cat control/control
            )
            rm -rf "$tmp"
          }

          validate_deb "$rootless" iphoneos-arm64 19.0 var/jb
          validate_deb "$rootful" iphoneos-arm 18.0 .

          echo '--- SHA256 ---'
          shasum -a 256 "$rootless" "$rootful"

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-RH-0.3.12-rootless-iOS15-18
          path: out/BetterWiFi-RH_0.3.12_Rootless_iOS15-18.deb
          if-no-files-found: error

      - name: Upload rootful package
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-RH-0.3.12-rootful-iOS15-17
          path: out/BetterWiFi-RH_0.3.12_Rootful_iOS15-17.deb
          if-no-files-found: error
 BetterWiFi-RH-rootful/control
          grep -q '^Architecture: iphoneos-arm64

      - name: Setup standard Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build rootless iOS 15-18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd BetterWiFi-RH-rootless
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:latest:15.0 ARCHS="arm64 arm64e"
          deb="$(find packages -maxdepth 1 -name '*.deb' -type f | head -1)"
          test -n "$deb"
          cp "$deb" ../out/BetterWiFi-RH_0.3.12_Rootless_iOS15-18.deb

      - name: Build rootful iOS 15-17
        shell: bash
        run: |
          set -euo pipefail
          cd BetterWiFi-RH-rootful
          make clean
          make package FINALPACKAGE=1 TARGET=iphone:clang:latest:15.0 ARCHS="arm64 arm64e" PACKAGE_ARCH=iphoneos-arm
          deb="$(find packages -maxdepth 1 -name '*.deb' -type f | head -1)"
          test -n "$deb"
          cp "$deb" ../out/BetterWiFi-RH_0.3.12_Rootful_iOS15-17.deb

      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          rootless=out/BetterWiFi-RH_0.3.12_Rootless_iOS15-18.deb
          rootful=out/BetterWiFi-RH_0.3.12_Rootful_iOS15-17.deb

          test "$(dpkg-deb -f "$rootless" Package)" = "com.betterwifirh.tweak"
          test "$(dpkg-deb -f "$rootless" Version)" = "0.3.12"
          test "$(dpkg-deb -f "$rootless" Architecture)" = "iphoneos-arm64"
          dpkg-deb -f "$rootless" Depends | grep -F 'firmware (>= 15.0)'
          dpkg-deb -f "$rootless" Depends | grep -F 'firmware (<< 19.0)'
          dpkg-deb -c "$rootless" | grep -F 'var/jb/Library/MobileSubstrate/DynamicLibraries/BetterWiFiRH.dylib'
          dpkg-deb -c "$rootless" | grep -F 'var/jb/Library/PreferenceBundles/BetterWiFiRHPrefs.bundle'

          test "$(dpkg-deb -f "$rootful" Package)" = "com.betterwifirh.tweak"
          test "$(dpkg-deb -f "$rootful" Version)" = "0.3.12"
          test "$(dpkg-deb -f "$rootful" Architecture)" = "iphoneos-arm"
          dpkg-deb -f "$rootful" Depends | grep -F 'firmware (>= 15.0)'
          dpkg-deb -f "$rootful" Depends | grep -F 'firmware (<< 18.0)'
          if dpkg-deb -c "$rootful" | grep -q 'var/jb/'; then
            echo "Rootful package unexpectedly contains /var/jb paths" >&2
            exit 1
          fi
          dpkg-deb -c "$rootful" | grep -F 'Library/MobileSubstrate/DynamicLibraries/BetterWiFiRH.dylib'
          dpkg-deb -c "$rootful" | grep -F 'Library/PreferenceBundles/BetterWiFiRHPrefs.bundle'

          echo '--- rootless metadata ---'
          dpkg-deb -f "$rootless"
          echo '--- rootful metadata ---'
          dpkg-deb -f "$rootful"
          shasum -a 256 "$rootless" "$rootful"

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-RH-0.3.12-rootless-iOS15-18
          path: out/BetterWiFi-RH_0.3.12_Rootless_iOS15-18.deb
          if-no-files-found: error

      - name: Upload rootful package
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-RH-0.3.12-rootful-iOS15-17
          path: out/BetterWiFi-RH_0.3.12_Rootful_iOS15-17.deb
          if-no-files-found: error
 BetterWiFi-RH-rootless/control
          grep -q '^Architecture: iphoneos-arm

      - name: Setup standard Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
