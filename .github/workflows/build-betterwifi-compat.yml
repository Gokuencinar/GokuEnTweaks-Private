          set -euo pipefail
          rootless=out/BetterWiFi-RH_0.3.12_Rootless_iOS15-18.deb
          rootful=out/BetterWiFi-RH_0.3.12_Rootful_iOS15-17.deb

          test "$(dpkg-deb -f "$rootless" Package)" = "com.betterwifirh.tweak"
          test "$(dpkg-deb -f "$rootless" Version)" = "0.3.12"
          test "$(dpkg-deb -f "$rootless" Architecture)" = "iphoneos-arm64"
          dpkg-deb -f "$rootless" Depends | grep -F 'firmware (>= 15.0)'
          dpkg-deb -f "$rootless" Depends | grep -F 'firmware (<< 19.0)'
          dpkg-deb -c "$rootless" | grep -F 'var/jb/Library/MobileSubstrate/DynamicLibraries/BetterWiFiRH.dylib'
          dpkg-deb -c "$rootless" | grep -F 'var/jb/Library/PreferenceBundles/BetterWiFiRHPrefs.bundle'

          test "$(dpkg-deb -f "$rootful" Package)" = "com.betterwifirh.tweak"
          test "$(dpkg-deb -f "$rootful" Version)" = "0.3.12"
          test "$(dpkg-deb -f "$rootful" Architecture)" = "iphoneos-arm"
          dpkg-deb -f "$rootful" Depends | grep -F 'firmware (>= 15.0)'
          dpkg-deb -f "$rootful" Depends | grep -F 'firmware (<< 18.0)'
          if dpkg-deb -c "$rootful" | grep -q 'var/jb/'; then
            echo "Rootful package unexpectedly contains /var/jb paths" >&2
            exit 1
          fi
          dpkg-deb -c "$rootful" | grep -F 'Library/MobileSubstrate/DynamicLibraries/BetterWiFiRH.dylib'
          dpkg-deb -c "$rootful" | grep -F 'Library/PreferenceBundles/BetterWiFiRHPrefs.bundle'

          echo '--- rootless metadata ---'
          dpkg-deb -f "$rootless"
          echo '--- rootful metadata ---'
          dpkg-deb -f "$rootful"
          shasum -a 256 "$rootless" "$rootful"

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-RH-0.3.12-rootless-iOS15-18
          path: out/BetterWiFi-RH_0.3.12_Rootless_iOS15-18.deb
          if-no-files-found: error

      - name: Upload rootful package
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-RH-0.3.12-rootful-iOS15-17
          path: out/BetterWiFi-RH_0.3.12_Rootful_iOS15-17.deb
          if-no-files-found: error
