name: Build BandLock Candidate 0.6.33

on:
  push:
    branches: [ main ]
    paths:
      - 'tweaks/BandLock/build/BandLock-0.6.33/**'
      - '.github/workflows/build-bandlock-diag-0633.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint tweaks/BandLock/build/BandLock-0.6.33/app/Resources/Info.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.33/app/Entitlements.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.33/daemon/Entitlements.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.33/fieldbridge/BandLockFieldBridge.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.33/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.plist
          python3 -m json.tool tweaks/BandLock/build/BandLock-0.6.33/app/Resources/countries.json >/dev/null
          test -s tweaks/BandLock/build/BandLock-0.6.33/app/Resources/CreditsAvatar.jpg
          ! grep -R --include='*.m' --include='*.h' -E 'Ã.|Â.|â€¦|â€”|�' tweaks/BandLock/build/BandLock-0.6.33/app
          grep -q 'pathForResource:@"CreditsAvatar" ofType:@"jpg"' tweaks/BandLock/build/BandLock-0.6.33/app/BLInfoViewController.m
          grep -q 'imageWithContentsOfFile:avatarPath' tweaks/BandLock/build/BandLock-0.6.33/app/BLInfoViewController.m
          grep -q 'killall BandLock' tweaks/BandLock/build/BandLock-0.6.33/layout/DEBIAN/postinst
          grep -q 'SUBPROJECTS += app daemon launcher fieldbridge' tweaks/BandLock/build/BandLock-0.6.33/Makefile
          ! grep -q 'clientprobe' tweaks/BandLock/build/BandLock-0.6.33/Makefile
          grep -q 'BandLock_LDFLAGS += -lroothide' tweaks/BandLock/build/BandLock-0.6.33/app/Makefile
          grep -q 'BLBreadcrumb.c' tweaks/BandLock/build/BandLock-0.6.33/app/Makefile
          grep -q 'BLLocalization.m' tweaks/BandLock/build/BandLock-0.6.33/app/Makefile
          grep -q 'BL_APP_LOCALIZATION=1' tweaks/BandLock/build/BandLock-0.6.33/app/Makefile
          grep -q 'BLCountryProfile.m' tweaks/BandLock/build/BandLock-0.6.33/app/Makefile
          grep -q 'BLCountryBandsViewController.m' tweaks/BandLock/build/BandLock-0.6.33/app/Makefile
          grep -q 'BLInfoViewController.m' tweaks/BandLock/build/BandLock-0.6.33/app/Makefile
          grep -q 'BLLanguageViewController.m' tweaks/BandLock/build/BandLock-0.6.33/app/Makefile
          grep -q 'BLFrequencyGlossaryViewController.m' tweaks/BandLock/build/BandLock-0.6.33/app/Makefile
          grep -q 'CFBundleShortVersionString</key><string>0.6.33</string>' tweaks/BandLock/build/BandLock-0.6.33/app/Resources/Info.plist
          grep -q 'com.apple.private.security.no-container' tweaks/BandLock/build/BandLock-0.6.33/app/Entitlements.plist
          grep -q 'com.apple.private.security.container-required' tweaks/BandLock/build/BandLock-0.6.33/app/Entitlements.plist
          ! grep -R --include='*.m' --include='*.h' -q 'BLProbe' tweaks/BandLock/build/BandLock-0.6.33/app
          ! grep -q 'diagnostic selftest fired' tweaks/BandLock/build/BandLock-0.6.33/app/BLControlViewController.m
          ! grep -q 'runDiagnosticSelfTest' tweaks/BandLock/build/BandLock-0.6.33/app/BLControlViewController.m
          ! grep -q 'RATTEST' tweaks/BandLock/build/BandLock-0.6.33/app/BLControlViewController.m
          ! grep -q 'RESTORETEST' tweaks/BandLock/build/BandLock-0.6.33/app/BLControlViewController.m
          grep -q 'initWithSupported:andActiveBands:' tweaks/BandLock/build/BandLock-0.6.33/daemon/BLTelephonyCore.m
          ! grep -R --include='*.m' -q 'auto refresh dispatch fired' tweaks/BandLock/build/BandLock-0.6.33/app
          ! grep -R --include='*.m' -q 'dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0' tweaks/BandLock/build/BandLock-0.6.33/app
          ! grep -q 'jbroot(' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          grep -q 'CFFIXED_USER_HOME' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          grep -q '/.jbroot-' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          grep -q 'BLDaemonSocketRelativePath = @"/tmp/com.gokuencinar.bandlockd.sock"' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          grep -q 'daemonSocketPath' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          grep -q 'jbroot(' tweaks/BandLock/build/BandLock-0.6.33/daemon/main.m
          grep -q 'com.gokuencinar.bandlockd.sock' tweaks/BandLock/build/BandLock-0.6.33/daemon/main.m
          grep -q 'SO_NOSIGPIPE' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          grep -q 'SO_RCVTIMEO' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          grep -q 'tv_sec = 30' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          grep -q 'attempt <= 40' tweaks/BandLock/build/BandLock-0.6.33/daemon/main.m
          grep -q 'apply retry write accepted' tweaks/BandLock/build/BandLock-0.6.33/daemon/main.m
          grep -q 'com.gokuencinar.bandlock.fieldtest' tweaks/BandLock/build/BandLock-0.6.33/daemon/BLTelephonyCore.m
          grep -q 'TWEAK_NAME = BandLockFieldBridge' tweaks/BandLock/build/BandLock-0.6.33/fieldbridge/Makefile
          grep -q 'com.apple.mobilephone' tweaks/BandLock/build/BandLock-0.6.33/fieldbridge/BandLockFieldBridge.plist
          grep -q 'com.gokuencinar.bandlock.fieldtest' tweaks/BandLock/build/BandLock-0.6.33/fieldbridge/FieldBridge.m
          grep -q 'launchFieldTestIfNeeded:' tweaks/BandLock/build/BandLock-0.6.33/fieldbridge/FieldBridge.m
          grep -q 'TPPhonePad' tweaks/BandLock/build/BandLock-0.6.33/fieldbridge/FieldBridge.m
          ! grep -q 'sendActionsForControlEvents' tweaks/BandLock/build/BandLock-0.6.33/fieldbridge/FieldBridge.m
          grep -q 'signal(SIGPIPE, SIG_IGN)' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          grep -q 'BandLock-client.log' tweaks/BandLock/build/BandLock-0.6.33/app/BLBreadcrumb.c
          grep -q 'BandLock-daemon.log' tweaks/BandLock/build/BandLock-0.6.33/daemon/main.m
          grep -q '@"mode_code"' tweaks/BandLock/build/BandLock-0.6.33/daemon/main.m
          grep -q 'result\[@"mode_code"\]' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          grep -q '@{@"cmd": @"fieldtest"}' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          ! grep -q 'tel://\*3001%2312345%23\*' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          ! grep -q 'CoreTelephonyClient' tweaks/BandLock/build/BandLock-0.6.33/app/BLTelephonyManager.m
          ! grep -q 'com.apple.CommCenter.fine-grained' tweaks/BandLock/build/BandLock-0.6.33/app/Entitlements.plist
          grep -q 'com.apple.CommCenter.fine-grained' tweaks/BandLock/build/BandLock-0.6.33/daemon/Entitlements.plist
          grep -q 'TOOL_NAME = BandLockDaemon' tweaks/BandLock/build/BandLock-0.6.33/daemon/Makefile
          grep -q 'TOOL_NAME = BandLockLauncher' tweaks/BandLock/build/BandLock-0.6.33/launcher/Makefile
          grep -q 'DOMAIN="user/501"' tweaks/BandLock/build/BandLock-0.6.33/layout/DEBIAN/postinst
          grep -q 'launchctl bootstrap "$DOMAIN" "$PLIST"' tweaks/BandLock/build/BandLock-0.6.33/layout/DEBIAN/postinst
          ! grep -q 'kickstart' tweaks/BandLock/build/BandLock-0.6.33/layout/DEBIAN/postinst
          ! grep -q 'launchctl .*system' tweaks/BandLock/build/BandLock-0.6.33/layout/DEBIAN/postinst
          grep -q 'uicache -p /Applications/BandLock.app' tweaks/BandLock/build/BandLock-0.6.33/layout/DEBIAN/postinst
          grep -q 'SOCKET="/tmp/${LABEL}.sock"' tweaks/BandLock/build/BandLock-0.6.33/layout/DEBIAN/postinst
          grep -q 'OLD_SOCKET="/tmp/bandlockd.sock"' tweaks/BandLock/build/BandLock-0.6.33/layout/DEBIAN/postinst
          grep -q 'killall MobilePhone' tweaks/BandLock/build/BandLock-0.6.33/layout/DEBIAN/postinst
          grep -q 'BLSetSelectedCountry(self.country)' tweaks/BandLock/build/BandLock-0.6.33/app/BLCountryDetailViewController.m
          grep -q 'Manage frequencies for %@' tweaks/BandLock/build/BandLock-0.6.33/app/BLControlViewController.m
          grep -q 'BandLockSelectedCountryISO' tweaks/BandLock/build/BandLock-0.6.33/app/BLCountryProfile.m
          grep -q 'BandLockLanguage' tweaks/BandLock/build/BandLock-0.6.33/app/BLLocalization.m
          grep -q 'zh-Hant' tweaks/BandLock/build/BandLock-0.6.33/app/BLLocalization.m
          grep -q 'zh-Hans' tweaks/BandLock/build/BandLock-0.6.33/app/BLLocalization.m
          grep -q 'Gokuencinar · GokuEn' tweaks/BandLock/build/BandLock-0.6.33/app/BLInfoViewController.m
          grep -q 'raw.githubusercontent.com/Gokuencinar/GokuEnREPO/main/Packages' tweaks/BandLock/build/BandLock-0.6.33/app/BLInfoViewController.m
          grep -q 'More information about frequencies' tweaks/BandLock/build/BandLock-0.6.33/app/BLInfoViewController.m
          ! grep -q 'BandLock Global 0.6.30' tweaks/BandLock/build/BandLock-0.6.33/app/BLControlViewController.m
          grep -q '^Version: 0.6.33$' tweaks/BandLock/build/BandLock-0.6.33/control

      - name: Build candidate
        shell: bash
        run: |
          set -euo pipefail
          cd tweaks/BandLock/build/BandLock-0.6.33
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          test -f packages/com.gokuencinar.bandlock_0.6.33_iphoneos-arm64e.deb
          APP_BIN="$(find .theos -path '*/Applications/BandLock.app/BandLock' -type f | head -n 1)"
          DAEMON_BIN="$(find .theos -path '*/usr/libexec/BandLockDaemon' -type f | head -n 1)"
          test -n "$APP_BIN"
          test -n "$DAEMON_BIN"
          command -v ldid >/dev/null 2>&1
          echo '=== App libraries ==='
          otool -L "$APP_BIN"
          otool -L "$APP_BIN" | grep -q 'libroothide.dylib'
          ldid -e "$APP_BIN" > /tmp/bandlock-app-entitlements.plist
          ldid -e "$DAEMON_BIN" > /tmp/bandlock-daemon-entitlements.plist
          grep -q 'platform-application' /tmp/bandlock-app-entitlements.plist
          grep -q 'com.apple.private.security.no-sandbox' /tmp/bandlock-app-entitlements.plist
          grep -q 'com.apple.private.security.no-container' /tmp/bandlock-app-entitlements.plist
          grep -q 'com.apple.private.security.container-required' /tmp/bandlock-app-entitlements.plist
          ! grep -q 'com.apple.CommCenter.fine-grained' /tmp/bandlock-app-entitlements.plist
          grep -q 'com.apple.CommCenter.fine-grained' /tmp/bandlock-daemon-entitlements.plist
          mkdir -p "$GITHUB_WORKSPACE/tweaks/BandLock/diagnostics"
          cp packages/com.gokuencinar.bandlock_0.6.33_iphoneos-arm64e.deb $GITHUB_WORKSPACE/tweaks/BandLock/diagnostics/BandLock-0.6.33-candidate.deb

      - name: Publish release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tweaks/BandLock/diagnostics/BandLock-0.6.33-candidate.deb
          if ! git diff --cached --quiet; then
            git commit -m "Publish BandLock 0.6.33 candidate"
            git pull --rebase origin main
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandLock-0.6.33-candidate
          path: tweaks/BandLock/build/BandLock-0.6.33/packages/*.deb
          if-no-files-found: error
