name: Build BandLock Diagnostic 0.6.9

on:
  push:
    branches: [ main ]
    paths:
      - 'tweaks/BandLock/build/BandLock-0.6.9/**'
      - '.github/workflows/build-bandlock-diag-069.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint tweaks/BandLock/build/BandLock-0.6.9/app/Resources/Info.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.9/app/Entitlements.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.9/daemon/Entitlements.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.9/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.plist
          python3 -m json.tool tweaks/BandLock/build/BandLock-0.6.9/app/Resources/countries.json >/dev/null
          grep -q 'SUBPROJECTS += app daemon launcher clientprobe' tweaks/BandLock/build/BandLock-0.6.9/Makefile
          grep -q 'APPLICATION_NAME = BandLock' tweaks/BandLock/build/BandLock-0.6.9/app/Makefile
          grep -q 'TARGET = iphone:clang:16.5:16.0' tweaks/BandLock/build/BandLock-0.6.9/Makefile
          grep -q 'BLTelephonyManager.m' tweaks/BandLock/build/BandLock-0.6.9/app/Makefile
          grep -q 'BLControlViewController.m' tweaks/BandLock/build/BandLock-0.6.9/app/Makefile
          grep -q 'BandLock-0.6.9-ipc.log' tweaks/BandLock/build/BandLock-0.6.9/app/BLProbe.h
          grep -q 'ipc sync begin' tweaks/BandLock/build/BandLock-0.6.9/app/BLTelephonyManager.m
          grep -q 'auto refresh dispatch fired' tweaks/BandLock/build/BandLock-0.6.9/app/BLControlViewController.m
          grep -q 'AF_UNIX' tweaks/BandLock/build/BandLock-0.6.9/app/BLTelephonyManager.m
          grep -q 'SO_NOSIGPIPE' tweaks/BandLock/build/BandLock-0.6.9/app/BLTelephonyManager.m
          ! grep -q 'CoreTelephonyClient' tweaks/BandLock/build/BandLock-0.6.9/app/BLTelephonyManager.m
          grep -q 'bandlock</string>' tweaks/BandLock/build/BandLock-0.6.9/app/Resources/Info.plist
          grep -q 'TOOL_NAME = BandLockDaemon' tweaks/BandLock/build/BandLock-0.6.9/daemon/Makefile
          grep -q 'TOOL_NAME = BandLockLauncher' tweaks/BandLock/build/BandLock-0.6.9/launcher/Makefile
          grep -q 'SBSLaunchApplicationWithIdentifier' tweaks/BandLock/build/BandLock-0.6.9/launcher/main.m
          grep -q 'TOOL_NAME = BandLockClientProbe' tweaks/BandLock/build/BandLock-0.6.9/clientprobe/Makefile
          grep -q '/tmp/com.gokuencinar.bandlockd.sock' tweaks/BandLock/build/BandLock-0.6.9/clientprobe/main.m
          plutil -lint tweaks/BandLock/build/BandLock-0.6.9/launcher/Entitlements.plist
          grep -q 'com.apple.springboard.launchapplications' tweaks/BandLock/build/BandLock-0.6.9/launcher/Entitlements.plist
          ! grep -q 'com.apple.CommCenter.fine-grained' tweaks/BandLock/build/BandLock-0.6.9/app/Entitlements.plist
          grep -q '<string>spi</string>' tweaks/BandLock/build/BandLock-0.6.9/daemon/Entitlements.plist
          grep -q '<string>preferences-write</string>' tweaks/BandLock/build/BandLock-0.6.9/daemon/Entitlements.plist
          grep -q 'com.apple.CoreTelephony.CommCenterHelper.allow' tweaks/BandLock/build/BandLock-0.6.9/daemon/Entitlements.plist
          grep -q 'sleepForTimeInterval:0.8' tweaks/BandLock/build/BandLock-0.6.9/daemon/main.m
          grep -q 'sleepForTimeInterval:1.0' tweaks/BandLock/build/BandLock-0.6.9/daemon/main.m
          grep -q 'queryCoreTelephony' tweaks/BandLock/build/BandLock-0.6.9/daemon/BLTelephonyCore.m
          grep -q 'writeLTEBands:' tweaks/BandLock/build/BandLock-0.6.9/daemon/main.m
          grep -q 'KeepAlive' tweaks/BandLock/build/BandLock-0.6.9/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.plist
          grep -q '/usr/libexec/BandLockDaemon' tweaks/BandLock/build/BandLock-0.6.9/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.plist
          grep -q 'com.gokuencinar.bandlock' tweaks/BandLock/build/BandLock-0.6.9/control

      - name: Build RootHide package
        shell: bash
        run: |
          set -euo pipefail
          cd tweaks/BandLock/build/BandLock-0.6.9
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -lh packages/*.deb
          test -f packages/com.gokuencinar.bandlock_0.6.9_iphoneos-arm64e.deb
          APP_BIN="$(find .theos -path '*/Applications/BandLock.app/BandLock' -type f | head -n 1)"
          DAEMON_BIN="$(find .theos -path '*/usr/libexec/BandLockDaemon' -type f | head -n 1)"
          LAUNCHER_BIN="$(find .theos -path '*/usr/bin/BandLockLauncher' -type f | head -n 1)"
          CLIENT_BIN="$(find .theos -path '*/usr/bin/BandLockClientProbe' -type f | head -n 1)"
          test -n "$APP_BIN"
          test -n "$DAEMON_BIN"
          test -n "$LAUNCHER_BIN"
          test -n "$CLIENT_BIN"
          test -x "$DAEMON_BIN"
          test -x "$LAUNCHER_BIN"
          test -x "$CLIENT_BIN"
          ! otool -L "$CLIENT_BIN" | grep -q 'libroothide.dylib'
          ldid -e "$LAUNCHER_BIN" > /tmp/bandlock-launcher-entitlements.plist
          grep -q 'com.apple.springboard.launchapplications' /tmp/bandlock-launcher-entitlements.plist
          command -v ldid >/dev/null 2>&1
          echo '=== BandLock LC_BUILD_VERSION ==='
          otool -l "$APP_BIN" | grep -A7 -m1 'LC_BUILD_VERSION'
          ldid -e "$APP_BIN" > /tmp/bandlock-app-entitlements.plist
          ldid -e "$DAEMON_BIN" > /tmp/bandlock-daemon-entitlements.plist
          ! grep -q 'com.apple.CommCenter.fine-grained' /tmp/bandlock-app-entitlements.plist
          grep -q 'com.apple.CommCenter.fine-grained' /tmp/bandlock-daemon-entitlements.plist
          grep -q '<string>spi</string>' /tmp/bandlock-daemon-entitlements.plist
          grep -q '<string>preferences-write</string>' /tmp/bandlock-daemon-entitlements.plist
          grep -q 'com.apple.CoreTelephony.CommCenterHelper.allow' /tmp/bandlock-daemon-entitlements.plist
          mkdir -p "$GITHUB_WORKSPACE/tweaks/BandLock/diagnostics"
          cp packages/com.gokuencinar.bandlock_0.6.9_iphoneos-arm64e.deb $GITHUB_WORKSPACE/tweaks/BandLock/diagnostics/BandLock-0.6.9-ipc.deb

      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tweaks/BandLock/diagnostics/BandLock-0.6.9-ipc.deb
          if ! git diff --cached --quiet; then
            git commit -m "Publish BandLock 0.6.9 IPC diagnostic"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandLock-0.6.9-ipc-deb
          path: tweaks/BandLock/build/BandLock-0.6.9/packages/*.deb
          if-no-files-found: error

