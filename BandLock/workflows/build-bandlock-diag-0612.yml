name: Build BandLock Candidate 0.6.12

on:
  push:
    branches: [ main ]
    paths:
      - 'tweaks/BandLock/build/BandLock-0.6.12/**'
      - '.github/workflows/build-bandlock-diag-0612.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint tweaks/BandLock/build/BandLock-0.6.12/app/Resources/Info.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.12/app/Entitlements.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.12/daemon/Entitlements.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.12/layout/Library/LaunchDaemons/com.gokuencinar.bandlockd.plist
          python3 -m json.tool tweaks/BandLock/build/BandLock-0.6.12/app/Resources/countries.json >/dev/null
          grep -q 'SUBPROJECTS += app daemon launcher' tweaks/BandLock/build/BandLock-0.6.12/Makefile
          ! grep -q 'clientprobe' tweaks/BandLock/build/BandLock-0.6.12/Makefile
          grep -q 'BandLock_LDFLAGS += -lroothide' tweaks/BandLock/build/BandLock-0.6.12/app/Makefile
          grep -q 'com.apple.private.security.no-container' tweaks/BandLock/build/BandLock-0.6.12/app/Entitlements.plist
          grep -q 'com.apple.private.security.container-required' tweaks/BandLock/build/BandLock-0.6.12/app/Entitlements.plist
          ! grep -R --include='*.m' --include='*.h' -q 'BLProbe' tweaks/BandLock/build/BandLock-0.6.12/app
          ! grep -R --include='*.m' -q 'auto refresh dispatch fired' tweaks/BandLock/build/BandLock-0.6.12/app
          ! grep -R --include='*.m' -q 'dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0' tweaks/BandLock/build/BandLock-0.6.12/app
          ! grep -q 'jbroot(' tweaks/BandLock/build/BandLock-0.6.12/app/BLTelephonyManager.m
          grep -q '/tmp/com.gokuencinar.bandlockd.sock' tweaks/BandLock/build/BandLock-0.6.12/app/BLTelephonyManager.m
          grep -q 'SO_NOSIGPIPE' tweaks/BandLock/build/BandLock-0.6.12/app/BLTelephonyManager.m
          grep -q 'SO_RCVTIMEO' tweaks/BandLock/build/BandLock-0.6.12/app/BLTelephonyManager.m
          ! grep -q 'CoreTelephonyClient' tweaks/BandLock/build/BandLock-0.6.12/app/BLTelephonyManager.m
          ! grep -q 'com.apple.CommCenter.fine-grained' tweaks/BandLock/build/BandLock-0.6.12/app/Entitlements.plist
          grep -q 'com.apple.CommCenter.fine-grained' tweaks/BandLock/build/BandLock-0.6.12/daemon/Entitlements.plist
          grep -q 'TOOL_NAME = BandLockDaemon' tweaks/BandLock/build/BandLock-0.6.12/daemon/Makefile
          grep -q 'TOOL_NAME = BandLockLauncher' tweaks/BandLock/build/BandLock-0.6.12/launcher/Makefile
          grep -q '^Version: 0.6.12$' tweaks/BandLock/build/BandLock-0.6.12/control

      - name: Build candidate
        shell: bash
        run: |
          set -euo pipefail
          cd tweaks/BandLock/build/BandLock-0.6.12
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          test -f packages/com.gokuencinar.bandlock_0.6.12_iphoneos-arm64e.deb
          APP_BIN="$(find .theos -path '*/Applications/BandLock.app/BandLock' -type f | head -n 1)"
          DAEMON_BIN="$(find .theos -path '*/usr/libexec/BandLockDaemon' -type f | head -n 1)"
          test -n "$APP_BIN"
          test -n "$DAEMON_BIN"
          command -v ldid >/dev/null 2>&1
          echo '=== App libraries ==='
          otool -L "$APP_BIN"
          otool -L "$APP_BIN" | grep -q 'libroothide.dylib'
          ldid -e "$APP_BIN" > /tmp/bandlock-app-entitlements.plist
          ldid -e "$DAEMON_BIN" > /tmp/bandlock-daemon-entitlements.plist
          grep -q 'platform-application' /tmp/bandlock-app-entitlements.plist
          grep -q 'com.apple.private.security.no-sandbox' /tmp/bandlock-app-entitlements.plist
          grep -q 'com.apple.private.security.no-container' /tmp/bandlock-app-entitlements.plist
          grep -q 'com.apple.private.security.container-required' /tmp/bandlock-app-entitlements.plist
          ! grep -q 'com.apple.CommCenter.fine-grained' /tmp/bandlock-app-entitlements.plist
          grep -q 'com.apple.CommCenter.fine-grained' /tmp/bandlock-daemon-entitlements.plist
          mkdir -p "$GITHUB_WORKSPACE/tweaks/BandLock/diagnostics"
          cp packages/com.gokuencinar.bandlock_0.6.12_iphoneos-arm64e.deb $GITHUB_WORKSPACE/tweaks/BandLock/diagnostics/BandLock-0.6.12-candidate.deb

      - name: Publish diagnostic candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tweaks/BandLock/diagnostics/BandLock-0.6.12-candidate.deb
          if ! git diff --cached --quiet; then
            git commit -m "Publish BandLock 0.6.12 candidate"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandLock-0.6.12-candidate
          path: tweaks/BandLock/build/BandLock-0.6.12/packages/*.deb
          if-no-files-found: error
