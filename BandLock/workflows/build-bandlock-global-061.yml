name: Build BandLock Global 0.6.1

on:
  push:
    branches: [ main ]
    paths:
      - 'tweaks/BandLock/build/BandLock-0.6.1/**'
      - '.github/workflows/build-bandlock-global-061.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint tweaks/BandLock/build/BandLock-0.6.1/app/Resources/Info.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.1/app/Entitlements.plist
          python3 -m json.tool tweaks/BandLock/build/BandLock-0.6.1/app/Resources/countries.json >/dev/null
          python3 - <<'PY'
          import json
          p='tweaks/BandLock/build/BandLock-0.6.1/app/Resources/countries.json'
          data=json.load(open(p, encoding='utf-8-sig'))
          assert len(data.get('countries', [])) >= 150
          assert any(c.get('name') == 'Spain' and 20 in c.get('bands', []) for c in data['countries'])
          PY
          grep -q 'SUBPROJECTS += app' tweaks/BandLock/build/BandLock-0.6.1/Makefile
          grep -q 'APPLICATION_NAME = BandLock' tweaks/BandLock/build/BandLock-0.6.1/app/Makefile
          grep -q 'applyPendingBandsWithCompletion:' tweaks/BandLock/build/BandLock-0.6.1/app/BLTelephonyManager.m
          grep -q '<string>spi</string>' tweaks/BandLock/build/BandLock-0.6.1/app/Entitlements.plist
          grep -q '<string>preferences-write</string>' tweaks/BandLock/build/BandLock-0.6.1/app/Entitlements.plist
          grep -q 'com.apple.CoreTelephony.CommCenterHelper.allow' tweaks/BandLock/build/BandLock-0.6.1/app/Entitlements.plist
          grep -q 'NSUserDefaults.standardUserDefaults' tweaks/BandLock/build/BandLock-0.6.1/app/BLTelephonyManager.m
          ! grep -q 'postNotificationName:BLPendingSelectionDidChangeNotification' tweaks/BandLock/build/BandLock-0.6.1/app/BLTelephonyManager.m
          grep -q 'sleepForTimeInterval:0.8' tweaks/BandLock/build/BandLock-0.6.1/app/BLTelephonyManager.m
          grep -q 'sleepForTimeInterval:1.0' tweaks/BandLock/build/BandLock-0.6.1/app/BLTelephonyManager.m
          grep -q 'Preparar bandas compatibles' tweaks/BandLock/build/BandLock-0.6.1/app/BLCountryDetailViewController.m
          grep -q 'com.gokuencinar.bandlock' tweaks/BandLock/build/BandLock-0.6.1/control
          test ! -d tweaks/BandLock/build/BandLock-0.6.1/prefs
          grep -q 'uicache -a' tweaks/BandLock/build/BandLock-0.6.1/layout/DEBIAN/postinst
          ! grep -R -E 'BLSpainBands|supportedSpain|activeSpain|selectOrangeSpain' tweaks/BandLock/build/BandLock-0.6.1

      - name: Build RootHide package
        shell: bash
        run: |
          set -euo pipefail
          cd tweaks/BandLock/build/BandLock-0.6.1
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -lh packages/*.deb
          test -f packages/com.gokuencinar.bandlock_0.6.1_iphoneos-arm64e.deb
          APP_BIN="$(find .theos -path '*/Applications/BandLock.app/BandLock' -type f | head -n 1)"
          test -n "$APP_BIN"
          if command -v ldid >/dev/null 2>&1; then
            ldid -e "$APP_BIN" > /tmp/bandlock-entitlements.plist
            grep -q 'com.apple.CommCenter.fine-grained' /tmp/bandlock-entitlements.plist
            grep -q '<string>spi</string>' /tmp/bandlock-entitlements.plist
          fi
          cp packages/com.gokuencinar.bandlock_0.6.1_iphoneos-arm64e.deb $GITHUB_WORKSPACE/tweaks/BandLock/debs/

      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tweaks/BandLock/debs/com.gokuencinar.bandlock_0.6.1_iphoneos-arm64e.deb
          if ! git diff --cached --quiet; then
            git commit -m "Publish BandLock Global 0.6.1"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandLock-0.6.1-deb
          path: tweaks/BandLock/build/BandLock-0.6.1/packages/*.deb
          if-no-files-found: error

  reindex:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dpkg tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Rebuild APT index
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only
          bash scripts/rebuild-packages.sh

      - name: Publish APT index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild APT index for BandLock Global 0.6.1"
            git push
          fi

