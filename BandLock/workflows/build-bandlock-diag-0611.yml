name: Build BandLock Diagnostic 0.6.11

on:
  push:
    branches: [ main ]
    paths:
      - 'tweaks/BandLock/build/BandLock-0.6.11/**'
      - '.github/workflows/build-bandlock-diag-0611.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint tweaks/BandLock/build/BandLock-0.6.11/app/Resources/Info.plist
          plutil -lint tweaks/BandLock/build/BandLock-0.6.11/daemon/Entitlements.plist
          grep -q 'SUBPROJECTS += app daemon launcher clientprobe' tweaks/BandLock/build/BandLock-0.6.11/Makefile
          grep -q 'BandLockClientProbe_LDFLAGS += -lroothide' tweaks/BandLock/build/BandLock-0.6.11/clientprobe/Makefile
          grep -q 'jbroot(@"/tmp/com.gokuencinar.bandlockd.sock")' tweaks/BandLock/build/BandLock-0.6.11/clientprobe/main.m
          plutil -lint tweaks/BandLock/build/BandLock-0.6.11/clientprobe/Entitlements.plist
          grep -q 'BandLockClientProbe_CODESIGN_FLAGS = -SEntitlements.plist' tweaks/BandLock/build/BandLock-0.6.11/clientprobe/Makefile
          grep -q 'TOOL_NAME = BandLockClientProbe' tweaks/BandLock/build/BandLock-0.6.11/clientprobe/Makefile

      - name: Build RootHide package
        shell: bash
        run: |
          set -euo pipefail
          cd tweaks/BandLock/build/BandLock-0.6.11
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          test -f packages/com.gokuencinar.bandlock_0.6.11_iphoneos-arm64e.deb
          CLIENT_BIN="$(find .theos -path '*/usr/bin/BandLockClientProbe' -type f | head -n 1)"
          APP_BIN="$(find .theos -path '*/Applications/BandLock.app/BandLock' -type f | head -n 1)"
          test -n "$CLIENT_BIN"
          test -n "$APP_BIN"
          echo '=== client probe libraries ==='
          otool -L "$CLIENT_BIN"
          otool -L "$CLIENT_BIN" | grep -q 'libroothide.dylib'
          ldid -e "$CLIENT_BIN" > /tmp/bandlock-client-entitlements.plist
          grep -q 'platform-application' /tmp/bandlock-client-entitlements.plist
          grep -q 'com.apple.private.security.no-sandbox' /tmp/bandlock-client-entitlements.plist
          grep -q 'com.apple.private.security.no-container' /tmp/bandlock-client-entitlements.plist
          echo '=== app libraries ==='
          otool -L "$APP_BIN" | grep -E 'BandLock|libroothide|UIKit|Foundation'
          mkdir -p "$GITHUB_WORKSPACE/tweaks/BandLock/diagnostics"
          cp packages/com.gokuencinar.bandlock_0.6.11_iphoneos-arm64e.deb $GITHUB_WORKSPACE/tweaks/BandLock/diagnostics/BandLock-0.6.11-ipc-roothide.deb

      - name: Publish diagnostic package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tweaks/BandLock/diagnostics/BandLock-0.6.11-ipc-roothide.deb
          if ! git diff --cached --quiet; then
            git commit -m "Publish BandLock 0.6.11 IPC RootHide diagnostic"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandLock-0.6.11-ipc-roothide-deb
          path: tweaks/BandLock/build/BandLock-0.6.11/packages/*.deb
          if-no-files-found: error
